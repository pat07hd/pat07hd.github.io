<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaproszenie na Urodziny</title>
    <style>
        /* Allgemeine Stile */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url(https://wallpapercave.com/wp/wp12980965.jpg) no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Header */
        header {
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5em;
            color: #FFD700;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        /* Einladung */
        .invitation {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            margin: 0 auto;
        }

        .invitation p {
            font-size: 1.2em;
            line-height: 1.5;
        }

        /* Details */
        .details {
            margin: 20px 0;
        }

        .details p {
            font-size: 1.5em;
            margin: 10px 0;
        }

        .details span {
            font-weight: bold;
            color: #FFD700;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 1.2em;
            color: #FFD700;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        /* Responsives Design */
        @media (max-width: 768px) {
            body {
                background-position: top center;
            }

            header h1 {
                font-size: 2em;
            }

            .invitation {
                padding: 15px;
            }

            .invitation p {
                font-size: 1em;
            }

            .details p {
                font-size: 1.2em;
            }

            footer {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Zaproszenie na Urodziny</h1>
    </header>
    <main>
        <div class="invitation">
            <p>Serdecznie zapraszam Cię na moje urodzinowe przyjęcie!</p>
            <div class="details">
                <p><span>📅 Data:</span> 22 lutego 2025</p>
                <p><span>⏰ Godzina:</span> 18:00 - 20:00</p>
                <p><span>📍 Adres:</span> Reeser Str. 59, 46446 Emmerich am Rhein</p>
            </div>
            <p>Przyjdź i świętuj razem ze mną przy pysznym jedzeniu i miłej atmosferze!</p>
        </div>
    </main>
    <footer>
        <p>Do zobaczenia! 🎉</p>
    </footer>
</body>
</html>
